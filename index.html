<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula Virtual - Lección Multimedia</title>
</head>
<body>

  <main>
    <h1>Unidad 3: Reproductores y Medios Adaptativos</h1>

    <section class="video-section">
      <h2>Videoclase Interactiva</h2>

      <video controls preload="metadata" width="640" height="360">
        <source src="clase.mp4" type="video/mp4">

        <track kind="subtitles" src="subtitulos-es.vtt" srclang="es" label="Español" default>

        <p>Tu navegador no soporta vídeo HTML5.</p>
      </video>
    </section>


    <section class="image-section">
      <h2>Esquema de Arquitectura Web</h2>
      <!-- El alumnado debe envolver en <figure>/<figcaption> y sustituir por <picture> con AVIF/WebP y srcset -->
      <figure>
        <picture>

            <source
                type="image/avif"
                srcset="
                    img/esquema-480.avif 480w, 
                    img/esquema-960.avif 960w,
                    img/esquema-1600.avif 1600w"
                sizes="(max-width: 600px) 100vw, 960px"
            >

            <source
                type="image/webp"
                srcset="
                img/esquema-480.webp 480w, 
                img/esquema-960.webp 960w,
                img/esquema-1600.webp 1600w"
                sizes="(max-width: 600px) 100vw, 960px">
            


            <img 
                src="img/esquema-desktop.jpg"
                srcset="
                img/esquema-480.jpg 480w,
                img/esquema-960.jpg 960w,
                img/esquema-1600.jpg 1600w"
                sizes="(max-width: 600px) 100vw, 960px"
                alt="Esquema de red"
                width="960"
                height="540"
                loading="lazy">
        </picture>
        <figcaption>Esquema de los componentes de la arquitectura de red.</figcaption>
      </figure>
    </section>
  </main>

</body>
</html>
